api_platform:
    title: Hello API Platform
    version: 1.0.0

    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
        html: ['text/html']

    patch_formats:
        json: ['application/merge-patch+json']

    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
            ApiKey:
                name: X-AUTH-API-KEY
                type: header    

    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
