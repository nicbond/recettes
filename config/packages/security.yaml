security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_admin_provider:
            entity:
                class: App\Entity\User\Admin
                property: email

        app_consumer_provider:
            entity:
                class: App\Entity\User\Consumer
                property: email

        api_client_provider:
            memory:
                users:
                    api-client:
                        roles: ['ROLE_API']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|images|js|assets|build)/
            security: false

        api_public:
            pattern: ^/api/public
            stateless: true
            provider: api_client_provider
            custom_authenticators:
                - App\Security\Api\ApiKeyAuthenticator      

        api_login:
            pattern: ^/api/login_check$
            stateless: true
            provider: app_consumer_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api_jwt:
            pattern: ^/api
            stateless: true
            provider: app_consumer_provider
            jwt: ~

        main:
            lazy: true
            provider: app_admin_provider
            user_checker: App\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: home
                enable_csrf: true

            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check

            logout:
                path: app_logout

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true

    access_control:
        # ====================================================================
        # 1. PUBLIC API EXCEPTIONS
        # ====================================================================
        - { path: ^/api/public, roles: ROLE_API }
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs($|/|.), roles: PUBLIC_ACCESS } 
        - { path: ^/api/consumers$, methods: [POST], roles: PUBLIC_ACCESS }

        # ====================================================================
        # 2. RESTRICTED API ACCESS
        # ====================================================================
        - { path: ^/api/consumers, roles: ROLE_CONSUMER }
        - { path: ^/api/private, roles: ROLE_CONSUMER }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # ====================================================================
        # 3. BACK-OFFICE AUTHENTICATION PROCESS
        # ====================================================================
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }

        # Public-facing pages of the back office / site
        - { path: ^/maintenance, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/contact, roles: PUBLIC_ACCESS }
        - { path: ^/activate, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }

        # ====================================================================
        # 4. SECURE BACK_OFFICE PAGES
        # ====================================================================
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }


when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
